plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing: if a keystore is provided via environment variables
// (e.g. from CI secrets), the release build is signed with it. Otherwise
// it falls back to the fixed debug keystore below so the release build
// is ALWAYS signed and installable -- an unsigned APK can't be installed
// on a real device at all (Android rejects it outright), which is
// exactly what was happening before this fallback existed.
def releaseKeystorePath = System.getenv('RELEASE_KEYSTORE_FILE')
def hasReleaseSigning = releaseKeystorePath != null && file(releaseKeystorePath).exists()

android {
    namespace 'dev.rocky.comcitime'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.rocky.comcitime'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // AGP's implicit debug signingConfig uses whatever debug.keystore
        // happens to exist on the machine running the build -- on CI that
        // is a fresh, ephemeral keystore generated on every single run, so
        // every CI-built debug/release-fallback APK ends up signed with a
        // different certificate and installing over the previous build
        // fails with a signature mismatch. Pointing "debug" at this fixed,
        // repo-committed keystore instead means every build (local or CI)
        // is signed identically, so `adb install -r` / a normal reinstall
        // always works without uninstalling first. Not a secret: this is
        // exactly the same purpose (and even the same conventional
        // alias/passwords) as Android's own auto-generated debug keystore,
        // just checked in so it's the same file everywhere.
        debug {
            storeFile file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Compose is used only for the bottom tab bar's layout/animation (a
    // small ComposeView island inside the otherwise-Java view tree -- see
    // MainActivity.buildBottomNav() / LiquidGlassTabBar.kt). Its glass
    // effect is the real AGSL shader in LiquidGlassShader.java driven
    // through Modifier.graphicsLayer, not Kyant0's published multiplatform
    // library -- every version of that library requires compileSdk 36+
    // (2.0.0 needs 37, needing Android Gradle Plugin 9.x), which is a much
    // larger toolchain migration than this app's build currently takes on.
    buildFeatures {
        compose true
    }
    composeOptions {
        // Paired with the Kotlin 1.9.24 compiler above -- see
        // https://developer.android.com/jetpack/androidx/releases/compose-kotlin
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'

    // 2024.09.00 (Compose UI 1.7.0), not the newest BOM available: it's the
    // first release with the native rememberGraphicsLayer()/drawLayer()
    // capture API the tab bar's real backdrop refraction needs (see
    // LiquidGlassTabBar.kt), picked specifically to stay clear of the
    // compileSdk 35/36/37 + AGP 8.6/9.x bumps later Compose/library
    // releases start requiring (see the other comment above).
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity:1.9.0'
}
